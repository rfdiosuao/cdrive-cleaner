name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "C 盘清理助手 ${{ github.ref_name }}"
          releaseBody: |
            ## C 盘清理助手 ${{ github.ref_name }}

            ### 下载
            - **MSI 安装包**：适合常规安装和更新。
            - **EXE 文件**：适合直接运行或手动分发。

            ### 安装说明
            1. 下载对应安装包。
            2. 运行安装程序或直接运行 EXE。
            3. 如果 Windows SmartScreen 提示，请确认来源后选择继续运行。
          releaseDraft: true
          prerelease: false
